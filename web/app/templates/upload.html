<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Upload de logs - SecLog Monitor</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container py-4">
  <h1 class="h3 mb-3">Importer des logs</h1>
  <div class="card mb-3"><div class="card-body">
    <input type="file" id="file" class="form-control mb-2" accept=".csv,.json,.txt">
    <button id="send" class="btn btn-primary">Envoyer</button>
    <small class="text-muted ms-2">CSV, JSON ou TXT, 50 Mo max</small>
  </div></div>
  <div id="result"></div>
</div>
<script>
const result = document.getElementById("result");
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
document.getElementById("send").addEventListener("click", async () => {
  const f = document.getElementById("file").files[0];
  if (!f) { result.innerHTML = '<div class="alert alert-warning">Choisis un fichier.</div>'; return; }
  const fd = new FormData(); fd.append("file", f);
  result.innerHTML = '<div class="alert alert-info">Envoi en cours...</div>';
  try {
    const r = await fetch("/upload", { method: "POST", body: fd });
    const d = await r.json();
    if (!r.ok) { result.innerHTML = '<div class="alert alert-danger">' + esc(d.error) + '</div>'; return; }
    let rows = d.preview.map(p => typeof p === "object"
      ? "<tr>" + Object.values(p).map(v => "<td>" + esc(typeof v === "object" ? JSON.stringify(v) : v) + "</td>").join("") + "</tr>"
      : "<tr><td>" + esc(p) + "</td></tr>").join("");
    let head = d.preview.length && typeof d.preview[0] === "object"
      ? "<tr>" + Object.keys(d.preview[0]).map(k => "<th>" + esc(k) + "</th>").join("") + "</tr>" : "";
    result.innerHTML =
      '<div class="alert alert-success">Fichier accepté : <b>' + esc(d.total_lines) + '</b> lignes, <b>' +
      esc(d.invalid_lines) + '</b> invalides. Statut : ' + esc(d.status) + '.</div>' +
      '<div class="table-responsive"><table class="table table-sm table-striped bg-white"><thead>' + head +
      '</thead><tbody>' + rows + '</tbody></table></div>';
  } catch (e) {
    result.innerHTML = '<div class="alert alert-danger">Erreur réseau.</div>';
  }
});
</script>
</body>
</html>
