# Pipeline minimal (sprint 2) : lit les fichiers JSON (une ligne = un événement)
# déposés dans le dossier surveillé et les indexe dans logs-security-*.
# Les pipelines CSV/JSON complets (grok, GeoIP, tags de gravité, erreurs) sont à écrire au sprint 3.

input {
  file {
    path => "/usr/share/logstash/watched/*.json"
    codec => "json"
    start_position => "beginning"
    sincedb_path => "/usr/share/logstash/data/seclog.sincedb"
  }
}

filter {
  # TODO sprint 3 : date, mutate, grok, geoip, tag de gravité, gestion d'erreurs
}

output {
  elasticsearch {
    hosts => ["http://elasticsearch:9200"]
    index => "logs-security-%{+YYYY.MM.dd}"
    manage_template => false   # l'index template est géré par elasticsearch/index-template.json
  }
}
