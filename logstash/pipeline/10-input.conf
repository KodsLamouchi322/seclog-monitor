input {
  file {
    path => ["/usr/share/logstash/watched/*.json", "/usr/share/logstash/watched/*.ndjson"]
    mode => "read"
    discover_interval => 1
    codec => "json"
    tags => ["fmt_json"]
    sincedb_path => "/usr/share/logstash/data/sincedb_json"
    file_completed_action => "log"
    file_completed_log_path => "/usr/share/logstash/data/completed_json.log"
  }
  file {
    path => "/usr/share/logstash/watched/*.csv"
    mode => "read"
    discover_interval => 1
    tags => ["fmt_csv"]
    sincedb_path => "/usr/share/logstash/data/sincedb_csv"
    file_completed_action => "log"
    file_completed_log_path => "/usr/share/logstash/data/completed_csv.log"
  }
  file {
    path => "/usr/share/logstash/watched/*.txt"
    mode => "read"
    discover_interval => 1
    tags => ["fmt_txt"]
    sincedb_path => "/usr/share/logstash/data/sincedb_txt"
    file_completed_action => "log"
    file_completed_log_path => "/usr/share/logstash/data/completed_txt.log"
  }
}
