output {
  if [tags] and ("_csvparsefailure" in [tags] or "_jsonparsefailure" in [tags] or "_grokparsefailure" in [tags] or "_dateparsefailure" in [tags]) {
    elasticsearch {
      hosts => ["http://elasticsearch:9200"]
      index => "seclog-errors-%{+YYYY.MM.dd}"
      data_stream => "false"
    }
  } else {
    elasticsearch {
      hosts => ["http://elasticsearch:9200"]
      index => "logs-security-%{+YYYY.MM.dd}"
      document_id => "%{[@metadata][doc_id]}"
      manage_template => false
      data_stream => "false"
    }
  }
}
