filter {
  grok {
    match => { "[log][file][path]" => "^.*/%{GREEDYDATA:[upload][file_name]}$" }
    tag_on_failure => []
  }

  if "fmt_csv" in [tags] {
    csv {
      source => "message"
      target => "csv"
      separator => ","
      skip_header => true
      skip_empty_columns => true
      columns => ["timestamp","source_ip","source_port","user","role","event_type","event_action","result","severity","country","city","latitude","longitude","host","message","http_method","http_uri","http_status","tags"]
    }
    if "_csvparsefailure" not in [tags] {
      date {
        match => ["[csv][timestamp]", "ISO8601"]
        target => "@timestamp"
        tag_on_failure => ["_dateparsefailure"]
      }
      mutate {
        rename => {
          "[csv][source_ip]"    => "[source][ip]"
          "[csv][source_port]"  => "[source][port]"
          "[csv][user]"         => "[user][name]"
          "[csv][role]"         => "[user][role]"
          "[csv][event_type]"   => "[event][type]"
          "[csv][event_action]" => "[event][action]"
          "[csv][result]"       => "result"
          "[csv][severity]"     => "severity"
          "[csv][country]"      => "[source][geo][country_name]"
          "[csv][city]"         => "[source][geo][city_name]"
          "[csv][latitude]"     => "[source][geo][location][lat]"
          "[csv][longitude]"    => "[source][geo][location][lon]"
          "[csv][host]"         => "[host][name]"
          "[csv][message]"      => "message"
          "[csv][http_method]"  => "[http][request][method]"
          "[csv][http_uri]"     => "[url][path]"
          "[csv][http_status]"  => "[http][response][status_code]"
        }
      }
      if [csv][tags] {
        mutate { split => { "[csv][tags]" => "," } }
        mutate { merge => { "tags" => "[csv][tags]" } }
      }
    }
  }

  if "fmt_txt" in [tags] {
    grok {
      match => { "message" => "%{TIMESTAMP_ISO8601:timestamp} %{WORD:[event][type]} %{WORD:result} user=%{DATA:[user][name]} ip=%{IP:[source][ip]} %{GREEDYDATA:message}" }
      overwrite => ["message"]
      tag_on_failure => ["_grokparsefailure"]
    }
    date { match => ["timestamp", "ISO8601"] target => "@timestamp" remove_field => ["timestamp"] tag_on_failure => ["_dateparsefailure"] }
  }

  mutate { lowercase => ["severity", "result"] }
  mutate {
    convert => {
      "[source][port]" => "integer"
      "[source][geo][location][lat]" => "float"
      "[source][geo][location][lon]" => "float"
      "[http][response][status_code]" => "integer"
    }
  }

  if ![severity_score] {
    translate {
      source => "severity"
      target => "severity_score"
      dictionary => { "critical" => "4" "high" => "3" "medium" => "2" "low" => "1" "info" => "0" }
      fallback => "0"
    }
  }
  mutate { convert => { "severity_score" => "integer" } }

  if [severity] in ["critical", "high"] {
    mutate { add_tag => ["alert_candidate"] }
  }
  if [result] == "failure" and [event][type] =~ /login|auth/ {
    mutate { add_tag => ["failed_login"] }
  }

  if [source][ip] and ![source][geo][location] {
    geoip {
      source => "[source][ip]"
      target => "[source][geo]"
      tag_on_failure => ["_geoip_lookup_failure"]
    }
  }

  if [source][geo][country_name] and ![source][geo][country_iso_code] {
    translate {
      source => "[source][geo][country_name]"
      target => "[source][geo][country_iso_code]"
      dictionary => {
        "Tunisia" => "TN"  "France" => "FR"  "Germany" => "DE"
        "United States" => "US"  "Russia" => "RU"  "China" => "CN"
        "Brazil" => "BR"  "India" => "IN"  "United Kingdom" => "GB"
        "Netherlands" => "NL"  "Italy" => "IT"  "Spain" => "ES"
      }
      fallback => "XX"
    }
  }

  fingerprint {
    source => ["@timestamp", "[source][ip]", "[user][name]", "[event][action]", "message"]
    concatenate_sources => true
    method => "SHA1"
    target => "[@metadata][doc_id]"
  }

  mutate { remove_field => ["@version", "csv", "[event][original]", "[log][file][path]"] }
}
